name: java

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
      - name: Maven build (skip tests)
        run: mvn -B -DskipTests package
      - name: Maven test (advisory — many tests are pre-existing failures from the upstream prototype; gated as a v0.1.x follow-up)
        run: mvn -B test
        continue-on-error: true
