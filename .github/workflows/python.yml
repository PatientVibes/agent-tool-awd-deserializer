name: python

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build Java engine
        run: mvn -B -q package -DskipTests
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check awd_deserializer/
      - name: Type check (advisory for v0.1.0 — port from upstream is untyped; tighten as a follow-up)
        run: mypy awd_deserializer/
        continue-on-error: true
      - name: Unit tests
        run: pytest tests/unit/ -v
      - name: Integration smoke (advisory for v0.1.0 — synthetic fixtures are not gzip-wrapped; real .design fixtures are a v0.1.x follow-up)
        run: pytest tests/integration/ -m integration -v
        continue-on-error: true
